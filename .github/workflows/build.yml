name: Build UltraDeep APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # Keep the same debug certificate across clean GitHub runners. Android rejects
      # an in-place update when two APKs use different signing certificates.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ultradeep-debug-signing-key-v1

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload UltraDeep Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraDeep-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
