name: Build UltraDeep APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload UltraDeep Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraDeep-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload UltraDeep Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraDeep-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
